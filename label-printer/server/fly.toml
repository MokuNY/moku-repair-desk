# Fly.io deploy (one small always-on machine). `fly launch --copy-config` then
# `fly secrets set SHOPIFY_API_KEY=... SHOPIFY_API_SECRET=... PRINTERS="Front counter=<token>"`
app = "moku-labels-b228fd"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ALLOWED_SHOPS = "jwenkp-vi.myshopify.com,moku-surf-shop-ny.myshopify.com"
  LABEL_WIDTH_IN = "2.2"
  LABEL_HEIGHT_IN = "1.25"

[http_service]
  internal_port = 8080
  force_https = true
  # The printer holds a WebSocket open 24/7 — never scale to zero.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
