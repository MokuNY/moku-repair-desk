# Repair Desk PRODUCTION server (moku-surf-shop-ny.myshopify.com). Deployed by
# hand from GitHub Actions: "Repair Desk production" (.github/workflows/repair-desk-production.yml).
#
# One machine only: the database is a SQLite file on the volume below, copied
# continuously to Fly object storage by Litestream (scripts/start.sh). The
# machine never sleeps, so the counter never waits for a cold start and the
# backup never pauses.
app = "moku-repair-desk"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATABASE_PATH = "/data/repair-desk.sqlite"
  SHOP_DOMAIN = "moku-surf-shop-ny.myshopify.com"
  PUBLIC_URL = "https://moku-repair-desk.fly.dev"
  SEED_OWNER = "Tom Gleason"
  REQUIRE_BACKUP = "1"
  # Set as Fly secrets by the workflow, never here: SHOPIFY_CLIENT_ID,
  # SHOPIFY_CLIENT_SECRET, SESSION_SECRET, EXPORT_KEY, LABEL_SERVER_URL,
  # REPAIR_DESK_TOKEN, and the backup bucket's BUCKET_NAME / AWS_* keys.

[[mounts]]
  source = "repair_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
