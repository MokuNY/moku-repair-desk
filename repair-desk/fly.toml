# Repair Desk TEST server (moku-repair-test.myshopify.com). Deployed by GitHub
# Actions (.github/workflows/repair-desk-test.yml). One machine only: the
# database is a SQLite file on the volume below.
app = "moku-repair-desk-test"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATABASE_PATH = "/data/repair-desk.sqlite"
  SHOP_DOMAIN = "moku-repair-test.myshopify.com"
  PUBLIC_URL = "https://moku-repair-desk-test.fly.dev"
  SHOPIFY_CLIENT_ID = "b7d5b1616386c24ba4c82cc7303bf5fb"
  SEED_OWNER = "Tom Gleason"
  # Label printing stays off in test: no LABEL_SERVER_URL / REPAIR_DESK_TOKEN.

[[mounts]]
  source = "repair_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
